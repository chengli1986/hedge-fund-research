name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt
      # The browser tests (page JavaScript) need Chromium. Without it they
      # skipped on every run; conftest now fails them when CI is set.
      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: pytest tests/ -v
